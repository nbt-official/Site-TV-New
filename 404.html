<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Black Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background for black edition */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ensure full viewport height */
            margin: 0;
            padding: 20px; /* Add some padding for smaller screens */
            box-sizing: border-box;
        }
        .error-container {
            background-color: #2d3748; /* Slightly lighter dark background for the card */
            padding: 3rem; /* Increased padding for better spacing */
            border-radius: 1.5rem; /* More rounded corners */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); /* Stronger shadow for dark theme */
            text-align: center;
            max-width: 500px; /* Max width for readability */
            width: 100%;
            border: 1px solid #4a5568; /* Subtle border for definition */
        }
        .error-image {
            max-width: 80%; /* Adjust image size for responsiveness */
            height: auto;
            margin: 0 auto 2.5rem; /* Center and add more bottom margin */
            display: block; /* Ensure it's a block element for margin auto */
        }
        .title {
            font-size: 2.5rem; /* Larger title */
            font-weight: 700; /* Bold */
            color: #e2e8f0; /* Light text for contrast */
            margin-bottom: 1rem;
        }
        .description {
            font-size: 1.125rem; /* Slightly larger description */
            color: #cbd5e0; /* Lighter text */
            margin-bottom: 2rem; /* More space before button */
            line-height: 1.6; /* Better readability */
        }
        .home-button {
            background-color: #667eea; /* A vibrant blue for the button */
            color: #ffffff;
            padding: 0.875rem 2rem; /* Generous padding */
            border-radius: 0.75rem; /* Rounded button */
            text-decoration: none;
            font-weight: 600; /* Semi-bold */
            transition: background-color 0.3s ease;
            display: inline-block; /* Allows padding and margin */
        }
        .home-button:hover {
            background-color: #5a67d8; /* Darker hover state */
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            .error-container {
                padding: 2rem; /* Reduce padding on small screens */
                margin: 1rem; /* Ensure some margin from edges */
            }
            .title {
                font-size: 2rem; /* Smaller title on small screens */
            }
            .description {
                font-size: 1rem; /* Smaller description on small screens */
            }
            .error-image {
                max-width: 90%; /* Make image slightly larger on smaller screens */
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <!-- Error image with a fallback placeholder -->
        <img src="https://mobond.yuppcdn.net/cf1/static/slt/images/error-img.svg" alt="404 Error Image" class="error-image" onerror="this.onerror=null;this.src='https://placehold.co/400x250/333333/cccccc?text=Image+Not+Found';">
        <h1 class="title">Oops! Page Not Found</h1>
        <p class="description">
            We can't seem to find the page you're looking for. It might have been moved or deleted.
        </p>
        <!-- Button now points to index.html -->
        <a href="index.html" class="home-button">Go to Homepage</a>
    </div>
</body>
</html>
