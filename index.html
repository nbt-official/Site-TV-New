<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEONBTV - Ultra Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #f0f0f0;
            overflow-x: hidden;
        }

        header {
            background: rgba(13, 13, 13, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #121212;
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 400px;
            border-radius: 1.5rem;
            padding: 2rem;
            position: relative;
        }

        .input-field {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 1rem;
            color: white;
            outline: none;
        }

        .input-field:focus { border-color: var(--accent); }

        .btn-primary {
            background: var(--accent);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .profile-pic {
            width: 60px;
            height: 60px;
            border-radius: 50%; /* Changed to Circle */
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            object-fit: cover;
        }

        .profile-pic:hover { border-color: var(--accent); transform: scale(1.1); }
        .profile-pic.active { border-color: var(--accent); }

        .slider-container { position: relative; max-width: 100%; height: 300px; margin: 0 auto 2.5rem auto; overflow: hidden; border-radius: 1.5rem; border: 1px solid var(--glass-border); box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5); }
        @media (max-width: 767px) { .slider-container { height: 220px; } }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; z-index: 1; transition: opacity 0.8s ease-in-out, transform 1.2s ease-in-out; transform: scale(1.05); }
        .slide.active { opacity: 1; z-index: 3; transform: scale(1); }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #050505 5%, transparent 60%); }
        
        .channel-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 1.25rem; padding: 0.75rem; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 170px; flex-shrink: 0; margin-right: 1.25rem; }
        .channel-card.is-live { cursor: pointer; }
        .channel-card.is-live:hover { transform: translateY(-10px); background: rgba(255, 255, 255, 0.07); border-color: var(--accent); box-shadow: 0 15px 30px -10px rgba(59, 130, 246, 0.3); }
        .channel-card.is-offline { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.5); }
        .channel-card img { border-radius: 0.9rem; width: 100%; height: 100px; object-fit: cover; margin-bottom: 0.75rem; }
        
        .status-badge { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; backdrop-filter: blur(4px); display: flex; align-items: center; gap: 4px; }
        .status-live { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .status-offline { background: rgba(156, 163, 175, 0.2); color: #d1d5db; border: 1px solid rgba(156, 163, 175, 0.3); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-live .status-dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: pulse 1.5s infinite; }
        .status-offline .status-dot { background: #9ca3af; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .horizontal-scroll-container { display: flex; overflow-x: auto; padding: 10px 5px 25px 5px; scroll-behavior: smooth; scrollbar-width: none; }
        .horizontal-scroll-container::-webkit-scrollbar { display: none; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }

        #userMenuBtn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--glass-border); }
    </style>
</head>

<script>

    const API_BASE = "https://nbtv-auth.vercel.app";

        { name: 'Pic 3', img: 'https://i.pinimg.com/474x/61/54/76/61547625e01d8daf941aae3ffb37f653.jpg' },
        { name: 'Pic 4', img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_0ktq5pFEz71BIDJbH0XXC9STcigP68GQy0j4jxhmOg&s=10' }
    ];

    function toggleModal() {
        const modal = document.getElementById('authModal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        if (modal.style.display === 'flex') {
            currentUser ? renderProfileView() : renderInitialView();
        }
    }

    function handleOutsideClick(e) {
        if(e.target.id === 'authModal') toggleModal();
    }

    function renderInitialView() {
        document.getElementById('modalBody').innerHTML = `
            <h2 class="text-xl font-bold mb-6 text-center">Welcome Back</h2>
            <button onclick="renderSignup()" class="btn-primary mb-3">Sign Up</button>
            <button onclick="renderLogin()" class="bg-white/10 text-white w-full p-3 rounded-xl font-bold hover:bg-white/20">Login</button>
        `;
    }

    function renderLogin() {
        document.getElementById('modalBody').innerHTML = `
            <h2 class="text-xl font-bold mb-6">Login</h2>
            <input type="text" id="loginPhone" placeholder="Whatsapp Number" class="input-field">
            <input type="password" id="loginPass" placeholder="Password" class="input-field">
            <button onclick="handleLogin()" class="btn-primary">Login</button>
            <button onclick="renderInitialView()" class="text-xs text-gray-500 mt-4 block mx-auto">Back</button>
        `;
    }

    function renderSignup() {
        document.getElementById('modalBody').innerHTML = `
            <h2 class="text-xl font-bold mb-6">Create Account</h2>
            <input type="text" id="regName" placeholder="Full Name" class="input-field">
            <input type="text" id="regPhone" placeholder="Whatsapp Number" class="input-field">
            <input type="password" id="regPass" placeholder="Password" class="input-field">
            <button onclick="handleSignup()" class="btn-primary">Continue</button>
            <button onclick="renderInitialView()" class="text-xs text-gray-500 mt-4 block mx-auto">Back</button>
        `;
    }

    function renderOTP(phone) {
        document.getElementById('modalBody').innerHTML = `
            <h2 class="text-xl font-bold mb-2">Verify Phone</h2>
            <p class="text-xs text-gray-400 mb-6">Enter the 6-digit code sent to ${phone}</p>
            <input type="text" id="otpCode" placeholder="0 0 0 0 0 0" class="input-field text-center tracking-[1rem] text-lg">
            <button onclick="handleVerify('${phone}')" class="btn-primary">Verify & Finish</button>
        `;
    }

    function selectProfile(imgUrl) {
        selectedProfileImg = imgUrl;
        const btn = document.getElementById('userMenuBtn');
        btn.innerHTML = `<img src="${imgUrl}" alt="Profile">`;
        toggleModal();
    }

    function renderProfileView() {
        let profileHtml = profiles.map(p => `
            <div class="text-center">
                <img src="${p.img}" onclick="selectProfile('${p.img}')" class="profile-pic mx-auto mb-2 ${selectedProfileImg === p.img ? 'active' : ''}">
                <p class="text-[10px] text-gray-400">${p.name}</p>
            </div>
        `).join('');

        document.getElementById('modalBody').innerHTML = `
            <h2 class="text-center font-bold mb-6 text-gray-400">Click a Profile Picture.</h2>
            <div class="grid grid-cols-2 gap-4 mb-8">
                ${profileHtml}
            </div>
            <div class="text-center border-t border-white/10 pt-4">
                <p class="text-xs text-gray-500 mb-4">ID: 94${currentUser.slice(-8)}</p>
                <button onclick="handleLogout()" class="text-red-500 font-bold text-sm hover:underline">LOGOUT</button>
            </div>
        `;
    }

async function handleLogin() {
    const phone = document.getElementById('loginPhone').value;
    const password = document.getElementById('loginPass').value;
    document.getElementById('modalBody').innerHTML = `<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-3xl mb-4"></i><p>Checking credentials...</p></div>`;
    try {
        const r = await fetch(`${API_BASE}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, password })
        });
        const d = await r.json();
        if (!r.ok) { alert(d.error); renderLogin(); return; }
        
        localStorage.setItem("authToken", d.token);
        currentUser = phone;
        
        // Set profile silently
        selectedProfileImg = profiles[0].img;
        document.getElementById('userMenuBtn').innerHTML = `<img src="${selectedProfileImg}" alt="Profile">`;
        
        renderSuccess();
    } catch (e) { alert("Login failed"); renderLogin(); }
}

    async function handleSignup() {
        const name = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        const password = document.getElementById('regPass').value;
        document.getElementById('modalBody').innerHTML = `<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-3xl mb-4"></i><p>Sending OTP...</p></div>`;
        const r = await fetch(`${API_BASE}/api/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, phone, password })
        });
        if (!r.ok) { const d = await r.json(); alert(d.error); renderSignup(); return; }
        renderOTP(phone);
    }

async function handleVerify(phone) {
    const otp = document.getElementById('otpCode').value;
    document.getElementById('modalBody').innerHTML = `<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-3xl mb-4"></i><p>Verifying & Logging in...</p></div>`;
    
    try {
        const r = await fetch(`${API_BASE}/api/verify`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, otp })
        });
        const d = await r.json();
        
        if (!r.ok) { 
            alert("Invalid OTP"); 
            renderOTP(phone); 
            return; 
        }
        
        if(d.token) {
            localStorage.setItem("authToken", d.token);
            currentUser = phone;
            
            // 1. Set default profile silently
            selectedProfileImg = profiles[0].img;
            const btn = document.getElementById('userMenuBtn');
            
            // 2. Apply the Blue Glow / Border to indicate logged-in status
            btn.innerHTML = `<img src="${selectedProfileImg}" alt="Profile" style="border: 2px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);">`;
            
            renderSuccess();
        }
    } catch (e) {
        alert("Verification failed");
        renderOTP(phone);
    }
}

function renderSuccess() {
    document.getElementById('modalBody').innerHTML = `
        <div class="text-center py-10">
            <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-3xl"></i>
            </div>
            <h2 class="text-xl font-bold">Success!</h2>
            <p class="text-gray-400 text-sm">You are now logged in.</p>
        </div>
    `;
    
    // Auto-close modal after 1.2 seconds
    setTimeout(() => { 
        document.getElementById('authModal').style.display = 'none';
    }, 1200);
}

    async function handleLogout() {
        const token = localStorage.getItem("authToken");
        if (token) {
            await fetch(`${API_BASE}/api/logout`, {
                method: "POST",
                headers: { Authorization: "Bearer " + token }
            });
        }
        localStorage.removeItem("authToken");
        currentUser = null;
        selectedProfileImg = null;
        document.getElementById('userMenuBtn').innerHTML = `<i class="fas fa-user-circle text-2xl"></i>`;
        toggleModal();
    }

    // --- CHANNEL & SLIDER LOGIC (SAME AYOURS) ---
    let slideIndex = 1;
    let autoSlideInterval;
    function showSlides(n) {
        let slides = document.getElementsByClassName("slide");
        if (n > slides.length) { slideIndex = 1 }
        if (n < 1) { slideIndex = slides.length }
        for (let i = 0; i < slides.length; i++) { slides[i].classList.remove('active'); }
        if(slides[slideIndex - 1]) slides[slideIndex - 1].classList.add('active');
    }
    function plusSlides(n) { clearInterval(autoSlideInterval); slideIndex += n; showSlides(slideIndex); startAutoSlide(); }
    function startAutoSlide() { autoSlideInterval = setInterval(() => plusSlides(1), 5000); }

    function createChannelCard(channel) {
        const isLive = channel.status === 'live';
        const card = document.createElement('div');
        card.className = `channel-card ${isLive ? 'is-live' : 'is-offline'}`;
        card.innerHTML = `
            <div class="relative overflow-hidden rounded-lg">
                <div class="status-badge ${isLive ? 'status-live' : 'status-offline'}">
                    <div class="status-dot"></div>${channel.status}
                </div>
                <img src="${channel.img}" alt="${channel.name}">
            </div>
            <div class="mt-2 px-1">
                <h3 class="font-bold text-sm truncate">${channel.name}</h3>
                <p class="text-[10px] text-gray-500 uppercase font-bold tracking-widest mt-0.5">${channel.category}</p>
            </div>
        `;
        card.onclick = () => { if (isLive) window.location.href = `/channel/${channel.id}`; };
        return card;
    }

    function init() {
        const container = document.getElementById('dynamicSections');
        //const sections = ['all', 'local', 'sports'];
                const sections = ['all', 'local', 'sports', 'entertainment', 'news', 'religious', 'kids', 'education'];
        sections.forEach(cat => {
            const filtered = (cat === 'all') ? channels : channels.filter(c => c.category === cat);
            const sec = document.createElement('section');
            sec.className = 'mb-12';
            sec.innerHTML = `
                <div class="flex justify-between items-center mb-5 px-1">
                    <h2 class="section-title uppercase tracking-wider">${cat} Channels</h2>
                    <a href="#" onclick="showCategory('${cat}'); return false;" class="text-blue-500 text-xs font-bold hover:underline">VIEW ALL</a>
                </div>
                <div class="horizontal-scroll-container"></div>
            `;
            const scrollBox = sec.querySelector('.horizontal-scroll-container');
            filtered.forEach(c => scrollBox.appendChild(createChannelCard(c)));
            container.appendChild(sec);
        });
        startAutoSlide();
    }

    function showCategory(category) {
        document.getElementById('allCategoriesView').classList.add('hidden');
        document.getElementById('sliderSection').classList.add('hidden');
        document.getElementById('singleCategoryView').classList.remove('hidden');
        const container = document.getElementById('singleCategoryChannelsContainer');
        container.innerHTML = '';
        let filtered = (category === 'all') ? channels : channels.filter(c => c.category === category);
        document.getElementById('singleCategoryTitle').innerText = category.toUpperCase();
        filtered.forEach(c => container.appendChild(createChannelCard(c)));
    }

    function showAllCategories() {
        document.getElementById('allCategoriesView').classList.remove('hidden');
        document.getElementById('sliderSection').classList.remove('hidden');
        document.getElementById('singleCategoryView').classList.add('hidden');
    }

window.onload = async () => {
    init();
    const token = localStorage.getItem("authToken");
    if (token) {
        try {
            const r = await fetch(`${API_BASE}/api/me`, { headers: { Authorization: "Bearer " + token } });
            const d = await r.json();
            if (d.loggedIn) { 
                currentUser = d.phone;
                selectedProfileImg = profiles[0].img;
                // Apply blue indicator on load
                const btn = document.getElementById('userMenuBtn');
                btn.innerHTML = `<img src="${selectedProfileImg}" alt="Profile" style="border: 2px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);">`;
            }
        } catch { 
            localStorage.removeItem("authToken"); 
        }
    }
};
